# Settings for nginx, the small web server that hands out the website files.
server {
    # Listen on 8080 (see the Dockerfile for why not 80).
    listen 8080;

    # The website files from "npm run build" live here.
    root /usr/share/nginx/html;

    # Hand out the file that was asked for. If it doesn't exist, hand out index.html
    # so the React app loads and decides what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be fresh, so users get new versions right after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built JS/CSS files have a unique code in their name that changes every build,
    # so browsers can safely keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
