receivers:
  otlp:                          # front door: the standard OpenTelemetry format
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:                    # lets the browser (frontend) send to it
          allowed_origins: ["https://todo-app-yaw8.onrender.com"]

processors:
  memory_limiter:                # stops the office from overflowing on a free instance
    check_interval: 1s
    limit_mib: 200
  batch: {}                      # bundles scrolls instead of sending one by one

exporters:
  otlphttp/grafana:              # rider to Grafana Cloud
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers:
      Authorization: "Basic ${env:GRAFANA_OTLP_AUTH}"

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/grafana] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/grafana] }
    logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/grafana] }