# Runs the database migrations ONCE, then stops.
# It must finish before the API starts, because the API needs the tables.
apiVersion: batch/v1
kind: Job                      # "run once until finished" (not "keep running forever")
metadata:
  name: todo-migrate
spec:
  backoffLimit: 3              # if it fails, retry up to 3 times, then give up
  template:
    spec:
      restartPolicy: Never     # a finished or failed run is not restarted in place
      containers:
        - name: migrate
          image: ghcr.io/muathali72/todo-migrate:latest
          # efbundle needs the database address. $(...) is filled in from the env below.
          args: ["--connection", "$(CONNECTION_STRING)"]
          env:
            # The database operator created these when it made the database (secret "todo-db-app").
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: todo-db-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: todo-db-app, key: password }
            # todo-db-rw always points to whichever database copy is primary right now.
            - name: CONNECTION_STRING
              value: "Host=todo-db-rw;Port=5432;Database=todo;Username=$(DB_USER);Password=$(DB_PASSWORD)"
