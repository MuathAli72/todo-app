# The API: 3 identical copies, spread across nodes, plus one fixed address for them.
apiVersion: apps/v1
kind: Deployment               # "keep this many copies running, forever"
metadata:
  name: todo-api
spec:
  replicas: 3                  # takes the traffic; 2 stay up while one is being updated
  selector:
    matchLabels: { app: todo-api }
  template:
    metadata:
      labels: { app: todo-api }   # the tag that the Service below uses to find these copies
    spec:
      # Spread rule: copies on different nodes as evenly as possible (never 2 more on one node).
      # "Honor" = ignore nodes that don't take normal work (like the control-plane node).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: { app: todo-api }
      containers:
        - name: api
          image: ghcr.io/muathali72/todo-api:latest
          ports:
            - containerPort: 10000      # the port set in the backend Dockerfile
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: todo-db-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: todo-db-app, key: password }
            # Same setting name the API reads on Render and in your User Secrets.
            - name: ConnectionStrings__TodoDb
              value: "Host=todo-db-rw;Port=5432;Database=todo;Username=$(DB_USER);Password=$(DB_PASSWORD)"
          # Reserve at least this much; never use more than the limit.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          # "Can you take visitors?" If not, stop sending them here (don't kill it).
          readinessProbe:
            httpGet: { path: /health, port: 10000 }
            periodSeconds: 5
            failureThreshold: 3
          # "Are you frozen?" If yes, restart it. Checks the API only, never the database.
          livenessProbe:
            httpGet: { path: /health, port: 10000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
# One fixed address ("todo-api") for all 3 copies. It forwards each request to a ready copy.
apiVersion: v1
kind: Service
metadata:
  name: todo-api
spec:
  selector: { app: todo-api }  # send traffic to pods with this tag
  ports:
    - port: 80                 # others call http://todo-api
      targetPort: 10000        # ...and it lands on the API's port 10000
