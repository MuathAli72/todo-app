# The front door: one address for the whole app.
#   /api/...         -> the API (with "/api" removed, so the API still gets /tasks)
#   everything else  -> the frontend
# Needs Envoy Gateway installed first (see the playbook).

# Which tool runs the front door (Envoy Gateway), and with what settings.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: todo-proxy
    namespace: envoy-gateway-system
---
# Settings for the front door itself: how many copies.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: todo-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ .Values.gateway.replicas }}
---
# The door: listen for normal web traffic on port 80.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: todo-gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
# The routing rules.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-routes
spec:
  parentRefs:
    - name: todo-gateway
  rules:
    # Anything starting with /api goes to the API, minus the "/api" part.
    - matches:
        - path: { type: PathPrefix, value: /api }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
      backendRefs:
        - name: todo-api
          port: 80
    # Everything else goes to the frontend.
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: todo-web
          port: 80
