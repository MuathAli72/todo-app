apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: todo-db
spec:
  instances: 2
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: todo
      owner: todo
  affinity:
    podAntiAffinityType: required
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
